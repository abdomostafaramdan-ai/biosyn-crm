<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#14201b;--mu:#66756e;--bd:#dde5e1;--ac:#0f766e;--ac2:#e0f2ef;--dg:#b42318;--wa:#168a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221e;--tx:#e8f0ec;--mu:#9bb0a7;--bd:#28372f;--ac:#2dd4bf;--ac2:#12342f;--dg:#f87171;--wa:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1714;--card:#17221e;--tx:#e8f0ec;--mu:#9bb0a7;--bd:#28372f;--ac:#2dd4bf;--ac2:#12342f;--dg:#f87171;--wa:#4ade80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{padding:14px 14px 6px}h1{margin:0 0 10px;font-size:19px}h1 span{color:var(--ac)}
.stats{display:flex;gap:8px}.st{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}.st b{display:block;font-size:20px}.st small{color:var(--mu)}
.bar{display:flex;gap:8px;padding:8px 14px;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.bar input{flex:1;min-width:140px}
button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 13px;cursor:pointer}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
:root[data-theme="dark"] .pri{color:#06201c}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#06201c}}
.tabs{display:flex;gap:4px;padding:0 14px;overflow-x:auto}.tabs button{flex:1;padding:9px 6px;white-space:nowrap;font-size:14px}.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.board{display:flex;gap:10px;overflow-x:auto;padding:10px 14px 24px}
.col{flex:0 0 78%;max-width:300px;background:var(--ac2);border-radius:14px;padding:8px}
.col h3{margin:2px 4px 8px;font-size:14px;display:flex;justify-content:space-between}.col h3 i{font-style:normal;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 10px;margin-bottom:7px;cursor:pointer}
.card b{display:block}.card small{color:var(--mu)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-top:4px}
.tag.w{background:transparent;border:1px solid var(--dg);color:var(--dg)}
.tw{overflow-x:auto;padding:10px 14px 24px}table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;min-width:560px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:13px}tr.r{cursor:pointer}
.empty{color:var(--mu);text-align:center;padding:24px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}.md{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.md label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;margin-top:14px}.row .pri{flex:1}
.log{border-top:1px solid var(--bd);margin-top:10px;padding-top:6px;font-size:13px}.log div{padding:4px 0;color:var(--mu)}.log b{color:var(--tx)}
.note{background:var(--ac2);color:var(--mu);font-size:12px;padding:6px 14px}
a.wa{color:var(--wa);text-decoration:none;font-weight:600}
.fl{display:flex;gap:8px;padding:0 14px 8px}
.fx{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0}.fx select{flex:1}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}.kp .st b{font-size:17px}
.ac{padding:0 14px 24px}.ac h4{margin:16px 0 6px}.ac table{min-width:0}.ac td{white-space:normal}.ac td,.ac th{padding:7px 8px}
.pos{color:var(--ac)}.neg{color:var(--dg)}
.hb{margin:9px 0}.hl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hl small{color:var(--mu)}.hb i{display:block;height:7px;border-radius:99px;background:var(--ac);margin-top:4px}
.card2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:12px}.card2 h4{margin:0 0 6px;font-size:14px}
.mc{display:flex;gap:3px;height:120px}.mcol{flex:1;display:flex;flex-direction:column;align-items:center}.mb{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%}.mb u,.mb s{flex:1;display:block;border-radius:3px 3px 0 0;min-height:1px}.mb u{background:var(--ac)}.mb s{background:var(--dg)}.mcol small,.lg{color:var(--mu);font-size:11px}
.md label.oto{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--tx)}
.cl{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}.pv{background:var(--ac2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;margin:4px 0}
.md .cons{display:flex;gap:16px;margin-top:10px}.md .cons label{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}.cons input{width:auto}
.lgv{background:var(--bg);align-items:center;z-index:50;padding:16px}.lgv .md{border-radius:18px;max-width:380px;background:var(--card);border:1px solid var(--bd);padding:20px}
.ib{display:grid;grid-template-columns:1fr;gap:10px;padding:0 14px 20px}
.ib.has .il{display:none}.ib:not(.has) .it{display:none}
@media(min-width:900px){.ib{grid-template-columns:340px 1fr}.ib.has .il,.ib:not(.has) .it{display:block}.ibk{display:none}}
.chip{padding:6px 12px;border-radius:99px;font-size:13px}.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.cl2{margin-top:8px}.ci{display:flex;gap:10px;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:12px;margin-bottom:6px;cursor:pointer}.ci.on{border-color:var(--ac)}
.av{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.cb{flex:1;min-width:0}.cr{display:flex;justify-content:space-between;gap:6px;align-items:center}.cr small{color:var(--mu);font-size:12px;flex:none}
.pv{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ub{flex:none;background:var(--ac);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;font-weight:700}
.cm{font-size:12px;color:var(--mu);margin-top:2px}
.th{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:10px}
.thh{display:flex;gap:8px;align-items:center}.ibk{padding:6px 10px}.tha{display:flex;gap:6px;margin-top:8px}.tha select{flex:1}
.pres{background:#fff8c5;color:#6b5300;border-radius:8px;padding:5px 10px;font-size:13px;margin-top:8px}
.ml{height:52vh;overflow-y:auto;padding:10px 2px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-top:8px}
.mw{max-width:80%;display:flex;flex-direction:column}.mw small{color:var(--mu);font-size:11px;margin-top:2px}
.mi{align-self:flex-start}.mo{align-self:flex-end;align-items:flex-end}
.mb2{padding:8px 11px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.mi .mb2{background:var(--bg);border:1px solid var(--bd)}.mo .mb2{background:var(--ac);color:var(--bg)}
.mn{align-self:stretch;background:#fff8c5;color:#4a3b00;border-radius:10px;padding:6px 10px;font-size:14px;white-space:pre-wrap}.mn small{color:#7a6a2a}
.cmp{margin-top:8px}.cpy{display:flex;gap:6px;align-items:center}.cpy code{flex:1;background:var(--ac2);border-radius:8px;padding:7px 9px;font-size:12px;word-break:break-all;direction:ltr;text-align:left}.cpy button{padding:6px 10px;font-size:13px}
@media print{body>*:not(#ov){display:none!important}#ov{position:static!important;background:none!important;display:block!important;padding:0!important}#md{max-height:none!important;box-shadow:none!important;border:0!important;width:100%!important;max-width:none!important;overflow:visible!important}.noprint{display:none!important}.rep table{page-break-inside:avoid}}
.rep h3{margin:14px 0 4px;font-size:15px}.rep table{width:100%;border-collapse:collapse;font-size:13px}.rep td,.rep th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:right}.gsb{float:left;font-size:15px;padding:2px 10px}
html[dir=ltr] .gsb{float:right}html[dir=ltr] th,html[dir=ltr] td{text-align:left}html[dir=ltr] .rep td,html[dir=ltr] .rep th{text-align:left}.bkb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px 0}.bkb button,.bkb select{font-size:13px;padding:5px 10px}.card.sel{outline:2px solid var(--ac,#2a7)}.card .bk{pointer-events:none;margin-inline-end:4px}.lgb{font-size:12px;padding:3px 10px;margin-inline-start:8px;cursor:pointer}

h1 span{color:var(--lime)}h1 .tag{background:rgba(177,247,72,.16);color:var(--lime)}
header .gsb{float:none;order:5;margin-inline-start:auto;background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22);border-radius:99px}
header .gsb+.gsb{margin-inline-start:0}
.stats .st{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;border-radius:14px}.stats .st b{color:var(--lime);font-size:22px}.stats .st small{color:#b9c2f5}
button,input,select,textarea{transition:border-color .15s,box-shadow .15s,background .15s,transform .1s}
button{min-height:40px;border-radius:12px}button:active{transform:scale(.97)}button:hover{border-color:var(--ac)}
.pri,.pri:hover{background:linear-gradient(135deg,#b1f748,#5ef04a)!important;border-color:transparent!important;color:#030540!important;font-weight:700;box-shadow:0 4px 12px rgba(94,240,74,.28)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(177,247,72,.5)}
input,select,textarea{border-radius:12px;min-height:40px}
.card,.card2,.st,.ci,.th{box-shadow:var(--sh)}.card,.card2{border-radius:16px}.card{transition:transform .12s,box-shadow .12s}.card:hover{transform:translateY(-2px)}
.stats .st,.kp .st{box-shadow:none}.kp .st{box-shadow:var(--sh);border-radius:14px}
.tag{background:var(--ac2);color:var(--ac);font-weight:600}
.col{background:var(--ac2);border-top:4px solid #8f9bd6}.col:nth-child(2){border-top-color:#4aa3ff}.col:nth-child(3){border-top-color:var(--lime2)}.col:nth-child(4){border-top-color:#f5a524}.col:nth-child(5){border-top-color:#9aa0b8}
table{box-shadow:var(--sh);overflow:hidden}tr.r:hover,tbody tr:hover td{background:var(--ac2)}th{background:var(--ac2)}
.empty{padding:28px 14px}.empty::before{content:"🌱";display:block;font-size:30px;margin-bottom:4px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:15;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -6px 20px rgba(10,14,58,.1);justify-content:space-around}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;font-size:11.5px;padding:4px 2px;min-height:48px;border-radius:14px;color:var(--mu)}
.tabs button::before{font-size:20px;line-height:1.1}
#t0::before{content:"🏠"}#t1::before{content:"👥"}#t6::before{content:"💬"}#t3::before{content:"💰"}#t4::before{content:"📣"}#t5::before{content:"⚙️"}
.tabs button.on{background:var(--ac2);color:var(--ac);border:0;font-weight:700;box-shadow:inset 0 -3px 0 var(--lime2)}
@media(min-width:900px){body{padding-bottom:24px}.tabs{position:static;inset:auto;box-shadow:none;border:0;background:transparent;padding:6px 14px;justify-content:flex-start}.tabs button{flex:none;flex-direction:row;gap:6px;padding:8px 16px;font-size:14px;min-height:40px;background:var(--card);border:1px solid var(--bd)}.tabs button.on{border-color:var(--ac);box-shadow:none}.tabs button::before{font-size:16px}}

.card,tbody tr,.ci{content-visibility:auto;contain-intrinsic-size:auto 64px}

@media(pointer:coarse){button,select,input{min-height:44px}}

}

 header{padding-inline:max(18px,calc((100vw - 1212px)/2))}

 .board{overflow:visible;gap:12px}.col{flex:1 1 0;min-width:0}

}

  const load=async()=>{try{const rows=await fetchAll(n);ok({docs:rows.map(r=>({id:r.id,data:()=>r.data}))})}catch(e){bad&&bad(e)}};
  load();SB.channel("rt-"+n).on("postgres_changes",{event:"*",schema:"public",table:n},()=>{clearTimeout(t);t=setTimeout(load,300)}).subscribe();
  return()=>{}}})});
const lg=h=>{$("lgb").innerHTML=h;$("lg").classList.add("on")};
const LH='<div style="text-align:center"><button class="lgb" type="button" onclick="setLang()">'+LNG_LBL+'</button></div><h2 style="margin:0 0 6px;font-size:20px;text-align:center">Biosyn <span style="color:var(--ac)">CRM</span></h2>';
async function signOut(){try{await SB.auth.signOut()}catch(e){}location.reload()}
function loginForm(msg){
 lg(LH+`<label>البريد الإلكتروني</label><input id="lg_e" type="email" autocomplete="username" inputmode="email"><label>كلمة المرور</label><input id="lg_p" type="password" autocomplete="current-password"><div class="neg" id="lg_m" style="min-height:22px;margin-top:8px;font-size:13px">${esc(msg||"")}</div><div class="row"><button class="pri" id="lg_go">دخول</button></div><div style="text-align:center;margin-top:12px"><a href="#" id="lg_f" class="wa">نسيت كلمة المرور؟</a></div>`);
 const go=async()=>{const{error}=await SB.auth.signInWithPassword({email:$("lg_e").value.trim(),password:$("lg_p").value});if(error){$("lg_m").textContent="البريد الإلكتروني أو كلمة المرور غير صحيحة";return}boot()};
 $("lg_go").onclick=go;$("lg_p").onkeydown=e=>{if(e.key==="Enter")go()};
 $("lg_f").onclick=async e=>{e.preventDefault();const em=$("lg_e").value.trim();if(!em){$("lg_m").textContent="اكتب بريدك الإلكتروني أولاً";return}
  await SB.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$("lg_m").textContent="إذا كان البريد مسجلاً فسيصلك رابط إعادة تعيين كلمة المرور"};
}
function recoveryForm(){
 lg(LH+`<p style="text-align:center;color:var(--mu);margin:4px 0">اكتب كلمة مرور جديدة</p><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input id="np" type="password" autocomplete="new-password"><div class="neg" id="np_m" style="min-height:22px;margin-top:8px;font-size:13px"></div><div class="row"><button class="pri" id="np_go">حفظ</button></div>`);
 $("np_go").onclick=async()=>{const p=$("np").value;if(p.length<8){$("np_m").textContent="8 أحرف على الأقل";return}
  const{error}=await SB.auth.updateUser({password:p});if(error){$("np_m").textContent="تعذر الحفظ: "+error.message;return}recov=false;boot()};
}
async function loadUsers(){const{data}=await SB.from("profiles").select("*").order("created_at");USERS=data||[];render()}
async function boot(){
 if(recov)return;
 const{data:{session}}=await SB.auth.getSession();if(!session){loginForm();return}
 const{data:pr,error}=await SB.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
 if(error||!pr||!pr.active){lg(LH+`<div class="empty">حسابك غير مفعّل. تواصل مع المدير لتفعيله.</div><div class="row"><button id="lo2">تسجيل خروج</button></div>`);$("lo2").onclick=signOut;return}
 $("lg").classList.remove("on");if(booted)return;booted=true;
 ME={id:pr.id,email:pr.email||session.user.email,role:pr.role,name:pr.name,perms:pr.perms||{},is_owner:!!pr.is_owner};
 ROLE=RN[pr.role]?pr.role:"viewer";setPerms();
 db=mkDb();applyRole();
 const mk=(arr,set)=>s=>{set(s.docs.map(d=>({...(typeof d.data==="function"?d.data():d.data),id:d.id})));render()};
 db.collection("contacts").onSnapshot(mk(0,x=>{C=x}),e=>{$("warn").style.display="block";$("warn").textContent="تعذر تحميل البيانات: "+(e.message||e.code)});
 if(P.camp)db.collection("campaigns").onSnapshot(mk(0,x=>{K=x}),()=>{});
 if(P.fin)db.collection("txns").onSnapshot(mk(0,x=>{T=x}),()=>{});
 if(P.users)loadUsers();
 if(P.inbox)startInbox();loadTasks();
}
function acctCard(){return `<div class="card2" style="margin-top:0"><h4>حسابي</h4><div class="hl"><span>${esc(ME.email)}</span><span class="tag">${RN[ROLE]}</span></div><label class="cl">كلمة مرور جديدة (8 أحرف على الأقل)</label><input type="password" id="pw1" autocomplete="new-password"><div class="row"><button id="pw_go">تغيير كلمة المرور</button><button id="lo" style="color:var(--dg)">تسجيل خروج</button></div></div>`}
const ROLES=[["admin","مدير","كل الصلاحيات"],["cofounder","شريك مؤسس","كل الصلاحيات، مثل المدير"],["accountant","محاسب","الحسابات والأرباح، والعملاء للقراءة فقط"],["moderator","مشرف","العملاء (إضافة وتعديل) وصندوق الرسائل"],["support","دعم ومبيعات","العملاء والحملات والاستيراد وصندوق الرسائل"],["viewer","مشاهد","قراءة فقط"]];
const PL=[["fin","الحسابات والأرباح"],["cw","إضافة وتعديل العملاء"],["cdel","حذف العملاء"],["camp","الحملات"],["imp","استيراد العملاء"],["bk","النسخ الاحتياطي والاستعادة"],["inbox","صندوق الرسائل"],["inbox_own","الصندوق: يرى محادثاته والمفتوحة غير المُسندة فقط"],["users","إدارة الفريق والصلاحيات"]];
const PERM={fin:["admin","cofounder","accountant"],cw:["admin","cofounder","moderator","support"],cdel:["admin","cofounder"],camp:["admin","cofounder","support"],imp:["admin","cofounder","support"],bk:["admin","cofounder"],users:["admin","cofounder"],inbox:["admin","cofounder","moderator","support"],inbox_own:[]};
const roleHas=(r,k)=>PERM[k].includes(r);
const effP=(u,k)=>u&&u.perms&&typeof u.perms[k]==="boolean"?u.perms[k]:roleHas(u&&u.role,k);
const setPerms=()=>{P={};Object.keys(PERM).forEach(k=>P[k]=effP(ME||{role:ROLE},k))};
let OPENP=null;
async function teamCall(body){
 try{const{data,error}=await SB.functions.invoke("admin-users",{body});
  if(error){let m="تعذر تنفيذ الطلب";try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}return{error:m}}
  return{data}}catch(e){return{error:"تعذر الاتصال بالخادم"}}
}
function permEditor(u){
 const custom=u.perms&&Object.keys(u.perms).length;
 return `<div class="pe" style="background:var(--ac2);border-radius:10px;padding:8px 10px;margin-top:6px">${PL.map(([k,n])=>{const on=effP(u,k),c=u.perms&&typeof u.perms[k]==="boolean";return `<label style="display:flex;gap:8px;align-items:center;margin:5px 0;color:var(--tx);font-size:14px"><input type="checkbox" data-pk="${k}" data-pu="${esc(u.id)}" ${on?"checked":""} style="width:auto">${n}${c?' <small class="tag" style="margin:0">مخصّص</small>':""}</label>`}).join("")}
 <div class="row" style="margin-top:6px">${custom?`<button data-pr="${esc(u.id)}" style="font-size:13px">العودة إلى صلاحيات الدور</button>`:'<small class="lg">هذه الصلاحيات حسب الدور. أي تغيير هنا يُطبَّق على هذا الشخص فقط.</small>'}</div></div>`;
}
function usersCard(){
 const opt=u=>ROLES.map(([k,n])=>`<option value="${k}" ${u.role===k?"selected":""}>${n}</option>`).join("");
 return `<div class="card2"><h4>الفريق (${USERS.length})</h4>
 ${NEWPW?`<div class="ok" style="margin:6px 0 10px;font-size:14px">أُنشئ الحساب <b>${esc(NEWPW.email)}</b><br>كلمة المرور المؤقتة: <code id="npw" style="font-size:15px;user-select:all">${esc(NEWPW.password)}</code> <button id="npw_c" style="padding:3px 10px">نسخ</button><br><small>أرسلها إلى هذا الشخص بنفسك (لن تظهر مرة أخرى)، واطلب منه تغييرها عند أول دخول.</small><div class="row"><button id="npw_x">تمام</button></div></div>`:""}
 ${USERS.map(u=>{const me=u.id===ME.id,lock=me||u.is_owner,has=PL.filter(([k])=>effP(u,k)).map(x=>x[1]);
  return `<div class="hb" style="border-bottom:1px solid var(--bd);padding-bottom:8px"><div class="hl"><span>${esc(u.name||u.email)}${u.is_owner?' <small class="tag">المالك</small>':""}${me?' <small class="tag">أنت</small>':""}${u.active?"":' <small class="tag w">موقوف</small>'}<br><small>${esc(u.email)}</small></span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><select data-ur="${esc(u.id)}" ${lock?"disabled":""} style="width:auto">${opt(u)}</select><label style="display:inline-flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" data-ua="${esc(u.id)}" ${u.active?"checked":""} ${lock?"disabled":""} style="width:auto">مفعّل</label></span></div>
  <small class="lg" style="display:block;margin-top:4px">${has.length?"يستطيع: "+esc(has.join("، ")):"قراءة العملاء فقط"}</small>
  ${lock?(u.is_owner&&!me?'<small class="lg">حساب المالك محمي: لا يمكن لأحد تغيير دوره أو صلاحياته أو إيقافه.</small>':""):`<div class="row" style="margin-top:6px"><button data-po="${esc(u.id)}" style="padding:4px 10px;font-size:13px">${OPENP===u.id?"إخفاء الصلاحيات":"الصلاحيات"}</button><button data-rp="${esc(u.id)}" data-em="${esc(u.email)}" style="padding:4px 10px;font-size:13px">كلمة مرور جديدة</button></div>${OPENP===u.id?permEditor(u):""}`}</div>`}).join("")}
 <h4 style="margin-top:14px">إضافة عضو إلى الفريق</h4>
 <div class="g2"><div><label class="cl">الاسم</label><input id="nu_n"></div><div><label class="cl">البريد الإلكتروني</label><input id="nu_e" type="email" inputmode="email"></div></div>
 <label class="cl">الدور</label><select id="nu_r">${ROLES.map(([k,n])=>`<option value="${k}" ${k==="moderator"?"selected":""}>${n}</option>`).join("")}</select>
 <small class="lg" id="nu_d"></small>
 <div class="row"><button class="pri" id="nu_go">إضافة</button></div>
 <small class="lg">بعد الإضافة يمكنك تخصيص صلاحياته من زر "الصلاحيات".</small>
 <details style="margin-top:10px"><summary class="lg" style="cursor:pointer">صلاحيات كل دور</summary><div class="tw" style="padding:6px 0 0"><table><tr><th></th>${ROLES.map(r=>`<th>${r[1]}</th>`).join("")}</tr>${PL.map(([k,n])=>`<tr><td style="white-space:normal">${n}</td>${ROLES.map(r=>`<td style="text-align:center">${roleHas(r[0],k)?"✓":"–"}</td>`).join("")}</tr>`).join("")}</table></div></details></div>`;
}
function bindAcct(v){
 if($("lo"))$("lo").onclick=signOut;
 if($("pw_go"))$("pw_go").onclick=async()=>{const p=$("pw1").value;if(p.length<8){alert("8 أحرف على الأقل");return}const{error}=await SB.auth.updateUser({password:p});alert(error?"تعذر التغيير: "+error.message:"تم تغيير كلمة المرور");$("pw1").value=""};
 const up=async(id,patch)=>{const{error}=await SB.from("profiles").update(patch).eq("id",id);if(error)alert(/محمي|بنفسك|المالك/.test(error.message||"")?error.message:"تعذر التغيير");loadUsers()};
 v.querySelectorAll("[data-ur]").forEach(s=>s.onchange=e=>{const u=USERS.find(x=>x.id===s.dataset.ur);
  if(u&&u.perms&&Object.keys(u.perms).length&&!confirm("تغيير الدور سيعيد صلاحيات هذا الشخص إلى صلاحيات الدور الجديد. هل تريد المتابعة؟")){e.target.value=u.role;return}
  up(s.dataset.ur,{role:e.target.value,perms:{}})});
 v.querySelectorAll("[data-ua]").forEach(c=>c.onchange=e=>up(c.dataset.ua,{active:e.target.checked}));
 v.querySelectorAll("[data-po]").forEach(b=>b.onclick=()=>{OPENP=OPENP===b.dataset.po?null:b.dataset.po;render()});
 v.querySelectorAll("[data-pk]").forEach(c=>c.onchange=e=>{const u=USERS.find(x=>x.id===c.dataset.pu);if(!u)return;
  const k=c.dataset.pk,np={...(u.perms||{})};if(e.target.checked===roleHas(u.role,k))delete np[k];else np[k]=e.target.checked;up(u.id,{perms:np})});
 v.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>up(b.dataset.pr,{perms:{}}));
 const desc=()=>{if($("nu_r")&&$("nu_d"))$("nu_d").textContent=(ROLES.find(r=>r[0]===$("nu_r").value)||[0,0,""])[2]};desc();
 if($("nu_r"))$("nu_r").onchange=desc;
 if($("nu_go"))$("nu_go").onclick=async()=>{
  const name=$("nu_n").value.trim(),email=$("nu_e").value.trim(),role=$("nu_r").value;
  if(!name){alert("اكتب الاسم");return}if(!/^\S+@\S+\.\S+$/.test(email)){alert("البريد الإلكتروني غير صحيح");return}
  $("nu_go").disabled=true;$("nu_go").textContent="جاري الإضافة...";
  const r=await teamCall({action:"create",name,email,role});
  if(r.error){alert(r.error);$("nu_go").disabled=false;$("nu_go").textContent="إضافة";return}
  NEWPW={email:r.data.email,password:r.data.password};loadUsers();
 };
 v.querySelectorAll("[data-rp]").forEach(b=>b.onclick=async()=>{
  if(!confirm("ستُنشأ كلمة مرور مؤقتة جديدة لـ "+b.dataset.em+" وستتعطل القديمة. هل تريد المتابعة؟"))return;
  b.disabled=true;const r=await teamCall({action:"reset_password",user_id:b.dataset.rp});
  if(r.error){alert(r.error);b.disabled=false;return}
  NEWPW={email:b.dataset.em,password:r.data.password};render();
 });
 if($("npw_c"))$("npw_c").onclick=async()=>{try{await navigator.clipboard.writeText(NEWPW.password);$("npw_c").textContent="تم النسخ"}catch(e){}};
 if($("npw_x"))$("npw_x").onclick=()=>{NEWPW=null;render()};
}

(async()=>{
 if(!window.supabase||!SUPABASE_URL){lg(LH+'<div class="empty">الإعداد ناقص: أدخل SUPABASE_URL و SUPABASE_ANON_KEY في بداية السكربت داخل index.html.</div>');return}
 SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){recov=true;recoveryForm()}else if(ev==="SIGNED_OUT"&&booted)location.reload()});
 boot();
})();
</script></body></html>
